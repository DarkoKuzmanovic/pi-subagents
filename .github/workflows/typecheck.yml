name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        # .npmrc sets omit=dev, so dev dependencies (TypeScript) must be
        # requested explicitly or the typecheck would run an unpinned tsc.
        run: npm ci --include=dev --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Check for stale @mariozechner namespace
        run: |
          found=$(grep -r "@mariozechner" --include="*.ts" --include="*.mjs" --include="*.json" src/ 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Found stale @mariozechner imports:"
            echo "$found"
            exit 1
          fi
          echo "No stale namespace references ✓"
